name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.6.2

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Configure Chrome for CI sandbox restrictions
        run: |
          cat > "$RUNNER_TEMP/chrome-no-sandbox" <<'EOF'
          #!/usr/bin/env bash
          exec "$CHROME_PATH" --no-sandbox "$@"
          EOF
          chmod +x "$RUNNER_TEMP/chrome-no-sandbox"
          echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROME_EXECUTABLE=$RUNNER_TEMP/chrome-no-sandbox" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run VM tests
        run: dart test

      - name: Run browser tests
        run: dart test -p chrome test/browser_document_test.dart -r expanded
